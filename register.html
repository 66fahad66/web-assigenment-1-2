  <h1>Delegate Registration</h1>
  <p class="intro">Fill in this form to register for an ICC conference.</p>

  <div class="container form-box">
    <form action="#" method="post">


      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name:</label>
        <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Your full name" required minlength="3" maxlength="30">
      </div>


      <div class="mb-3">
        <label for="society" class="form-label">Society:</label>
        <input type="text" class="form-control" id="society" name="society" value="ICC MUN Society" readonly>
      </div>


      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" class="form-control" id="password" name="password" required minlength="6" maxlength="15">
      </div>


      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
      </div>


      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth:</label>
        <input type="date" class="form-control" id="dob" name="dob">
      </div>


      <div class="mb-3">
        <label for="website" class="form-label">Website (optional):</label>
        <input type="url" class="form-control" id="website" name="website" placeholder="https://">
      </div>


      <div class="mb-3">
        <label for="color" class="form-label">Favourite Color:</label>
        <input type="color" class="form-control form-control-color" id="color" name="color" value="#0b4db3">
      </div>


      <div class="mb-3">
        <label for="age" class="form-label">Age:</label>
        <input type="number" class="form-control" id="age" name="age" min="15" max="30">
      </div>


      <div class="mb-3">
        <label for="time" class="form-label">Preferred Session Time:</label>
        <input type="time" class="form-control" id="time" name="time">
      </div>


      <div class="mb-3">
        <label for="exp" class="form-label">MUN Experience (0 to 10):</label>
        <input type="range" class="form-range" id="exp" name="exp" min="0" max="10">
      </div>


      <div class="mb-3">
        <label for="committee" class="form-label">Committee:</label>
        <select class="form-select" id="committee" name="committee">
          <option value="unhrc">UNHRC</option>
          <option value="unsc" selected>UNSC</option>
          <option value="crisis">Crisis Committee</option>
        </select>
        <p>Pick the committee you want to join.</p>
      </div>


      <p class="group-title">Role:</p>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="delegate" name="role" value="delegate" checked>
        <label for="delegate" class="form-check-label">Delegate</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="chair" name="role" value="chair">
        <label for="chair" class="form-check-label">Chair</label>
      </div>


      <p class="group-title">Interests:</p>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="debate" name="interest" value="debate" checked>
        <label for="debate" class="form-check-label">Debate</label>
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="diplomacy" name="interest" value="diplomacy">
        <label for="diplomacy" class="form-check-label">Diplomacy</label>
      </div>


      <div class="mb-3 mt-3">
        <label for="paper" class="form-label">Upload Position Paper:</label>
        <input type="file" class="form-control" id="paper" name="paper">
      </div>


      <div class="mb-3">
        <label for="message" class="form-label">Why do you want to join?</label>
        <textarea class="form-control" id="message" name="message" rows="4" maxlength="200"></textarea>
      </div>


      <div class="mb-3">
        <label for="fee" class="form-label">Fee Status:</label>
        <input type="text" class="form-control" id="fee" name="fee" value="Pay at the venue" disabled>
      </div>

      <input type="submit" class="btn" value="Register">

    </form>
  </div>

  <div class="footer">
    <p>ICC MUN Society, University of Central Punjab</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
